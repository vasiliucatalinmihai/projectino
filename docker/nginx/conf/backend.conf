# Backend (NestJS API) — dev-api.production.io
server {
    listen 80;
    server_name dev-api.production.io;

    # Allow sizeable briefing/document uploads
    client_max_body_size 50M;

    location / {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM pipeline steps chain several model calls in one request (e.g. delivery
        # planning, tech design's critic loop) and can legitimately run past nginx's
        # 60s default — without this, nginx 504s the client while the backend keeps
        # working unseen, which looks like the button "did nothing".
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
